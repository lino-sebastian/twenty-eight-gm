# Render Blueprint: https://render.com/docs/blueprint-spec
# One free web service runs the game server and serves the built web app.
services:
  - type: web
    name: twenty-eight
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
